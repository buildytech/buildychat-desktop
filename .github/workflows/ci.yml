name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      # The WebP encoder is gen2brain/webp's embedded libwebp, never a system one (scripts/gate.sh).
      TAGS: nodynamic
      # The app version: scripts/package.sh and the desktop build stamp it (internal/appid.Version, status host.version).
      BUILDYCHAT_VERSION: 0.1.0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux GUI libraries (GTK 4, WebKitGTK 6)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Frontend from the pinned chat submodule
        run: bash scripts/build-frontend.sh
      - name: Vet
        run: go vet -tags "$TAGS" ./ ./internal/... ./cmd/...
      - name: Tests (unit, runtime HTTP contract on the desktop surface, WebP goldens)
        run: go test -tags "$TAGS" -count=1 -v ./ ./internal/...
      - name: Headless build (server tag)
        run: go build -tags "server $TAGS" -ldflags "-X github.com/buildytech/buildychat-desktop/internal/appid.Version=$BUILDYCHAT_VERSION" -o bin/buildychat-server ./cmd/buildychat
      - name: Desktop build
        run: go build -tags "$TAGS" -ldflags "-X github.com/buildytech/buildychat-desktop/internal/appid.Version=$BUILDYCHAT_VERSION" -o bin/buildychat ./cmd/buildychat
      - uses: actions/upload-artifact@v4
        with:
          name: buildychat-${{ matrix.os }}
          path: bin/
          retention-days: 7
      - name: Packaging tools (wails3 CLI of the pinned Wails; NSIS on Windows)
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          if [ "$RUNNER_OS" = "Windows" ] && ! command -v makensis >/dev/null; then
            choco install nsis -y --no-progress >/dev/null
            echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y dpkg-dev file >/dev/null; fi
      - name: Unsigned installers (scripts/package.sh)
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: buildychat-installer-${{ matrix.os }}
          path: dist/
          retention-days: 14
