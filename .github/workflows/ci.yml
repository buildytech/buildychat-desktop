name: ci
on:
  push:
    branches: [main]
    # A v* tag builds the same installers and publishes them as a GitHub Release (job `release`).
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      # The WebP encoder is gen2brain/webp's embedded libwebp, never a system one (scripts/gate.sh).
      TAGS: nodynamic
      # The app version: scripts/package.sh and the desktop build stamp it (internal/appid.Version, status host.version).
      BUILDYCHAT_VERSION: 0.1.0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # A v* tag stamps its own version (v0.1.0 -> 0.1.0); every other run keeps the default above.
      - name: Version of a tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "BUILDYCHAT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux GUI libraries (GTK 4, WebKitGTK 6)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Frontend from the pinned chat submodule
        run: bash scripts/build-frontend.sh
      - name: Vet
        run: go vet -tags "$TAGS" ./ ./internal/... ./cmd/...
      - name: Tests (unit, runtime HTTP contract on the desktop surface, WebP goldens)
        run: go test -tags "$TAGS" -count=1 -v ./ ./internal/... ./cmd/...
      # Windows binaries need the .exe suffix: without it the artifact holds files Windows will not run.
      - name: Binary suffix
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then echo "EXE=.exe" >> "$GITHUB_ENV"; else echo "EXE=" >> "$GITHUB_ENV"; fi
      - name: Headless build (server tag)
        run: go build -tags "server $TAGS" -ldflags "-X github.com/buildytech/buildychat-desktop/internal/appid.Version=$BUILDYCHAT_VERSION" -o "bin/buildychat-server$EXE" ./cmd/buildychat
      - name: Desktop build
        run: go build -tags "$TAGS" -ldflags "-X github.com/buildytech/buildychat-desktop/internal/appid.Version=$BUILDYCHAT_VERSION" -o "bin/buildychat$EXE" ./cmd/buildychat
      - name: Binaries carry their suffix
        run: |
          test -f "bin/buildychat$EXE" && test -f "bin/buildychat-server$EXE"
          ls -l bin
      - uses: actions/upload-artifact@v4
        with:
          name: buildychat-${{ matrix.os }}
          path: bin/
          retention-days: 7
      - name: Packaging tools (wails3 CLI of the pinned Wails; NSIS on Windows)
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          if [ "$RUNNER_OS" = "Windows" ] && ! command -v makensis >/dev/null; then
            choco install nsis -y --no-progress >/dev/null
            echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y dpkg-dev file >/dev/null; fi
      - name: Unsigned installers (scripts/package.sh)
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: buildychat-installer-${{ matrix.os }}
          path: dist/
          retention-days: 14

  # Publishes the unsigned installers of a v* tag as a GitHub Release. The notes are docs/releases/<tag>.md (this
  # version's changes only). Stable file names, so a link survives from one release to the next.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: buildychat-installer-*
          path: parts
      - name: Assemble the release files
        run: |
          set -euo pipefail
          notes="docs/releases/$TAG.md"
          test -s "$notes" || { echo "release: $notes is missing" >&2; exit 1; }
          mkdir out
          ver="${TAG#v}"
          # Windows x64: installer and portable zip (buildychat.exe inside).
          cp parts/buildychat-installer-windows-2025/buildychat-amd64-installer.exe out/BuildY-Chat-windows-x64-installer.exe
          cp parts/buildychat-installer-windows-2025/buildychat-windows-amd64.zip out/BuildY-Chat-windows-x64-portable.zip
          unzip -l out/BuildY-Chat-windows-x64-portable.zip | grep -q 'buildychat\.exe' || { echo "release: no buildychat.exe in the portable zip" >&2; exit 1; }
          # macOS arm64 (the runner's CPU): disk image and zipped app.
          cp "parts/buildychat-installer-macos-15/BuildY Chat.dmg" out/BuildY-Chat-macos-arm64.dmg
          cp parts/buildychat-installer-macos-15/BuildY-Chat-macos-arm64.app.zip out/BuildY-Chat-macos-arm64.app.zip
          # Linux x64: DEB, and the AppImage when linuxdeploy produced one.
          cp "parts/buildychat-installer-ubuntu-24.04/buildychat_${ver}_amd64.deb" out/
          for f in parts/buildychat-installer-ubuntu-24.04/*.AppImage; do
            [ -f "$f" ] && cp "$f" out/BuildY-Chat-linux-x64.AppImage
          done
          (cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: Publish the release
        run: |
          set -euo pipefail
          gh release create "$TAG" out/* --verify-tag --title "BuildY Chat $TAG" --notes-file "docs/releases/$TAG.md"
