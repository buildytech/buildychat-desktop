name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux GUI libraries (GTK 4, WebKitGTK 6)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Frontend from the pinned chat submodule
        run: bash scripts/build-frontend.sh
      - name: Vet
        run: go vet ./ ./internal/... ./cmd/...
      - name: Tests (unit + runtime HTTP contract, desktop surface)
        run: go test -count=1 -v ./ ./internal/...
      - name: Headless build (server tag)
        run: go build -tags server -o bin/buildychat-server ./cmd/buildychat
      - name: Desktop build
        run: go build -o bin/buildychat ./cmd/buildychat
      - uses: actions/upload-artifact@v4
        with:
          name: buildychat-${{ matrix.os }}
          path: bin/
          retention-days: 7
